<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0a0c0f;
    --surface:  #111418;
    --border:   #1e2430;
    --muted:    #2c3344;
    --text:     #c8d0e0;
    --dim:      #5a6478;
    --accent:   #3b82f6;
    --stale:    #ef4444;
    --good:     #22c55e;
    --unknown:  #f59e0b;
    --updating: #8b5cf6;
    --mono:     'IBM Plex Mono', monospace;
    --sans:     'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    min-height: 100vh;
  }

  /* TOP BAR */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .logo {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .logo span { color: var(--dim); font-weight: 400; }
  .system-tag {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--dim);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 2px;
  }
  .topbar-right { display: flex; align-items: center; gap: 10px; }

  /* BUTTONS */
  .btn {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 7px 16px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: #2563eb; border-color: #2563eb; color: #fff; }
  .btn-danger { border-color: var(--stale); color: var(--stale); }
  .btn-danger:hover { background: var(--stale); color: #fff; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* STAT BAR */
  .stat-bar {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .stat {
    flex: 1;
    padding: 18px 28px;
    border-right: 1px solid var(--border);
  }
  .stat:last-child { border-right: none; }
  .stat-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 6px;
  }
  .stat-value {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 600;
    line-height: 1;
  }
  .stat-value.stale { color: var(--stale); }
  .stat-value.good  { color: var(--good); }
  .stat-value.warn  { color: var(--unknown); }
  .stat-value.neutral { color: var(--text); }

  /* TOOLBAR */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 28px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .toolbar-left { display: flex; align-items: center; gap: 10px; }
  .search-wrap { position: relative; }
  .search-input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 12px 7px 32px;
    border-radius: 2px;
    width: 260px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--dim);
    font-size: 13px;
  }
  .filter-select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    padding: 7px 12px;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  /* TABLE */
  .table-wrap {
    padding: 0 28px 28px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 16px;
  }
  thead th {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  tbody tr:hover { background: var(--surface); }
  tbody td {
    padding: 11px 12px;
    font-size: 13px;
    vertical-align: middle;
  }
  td.mono { font-family: var(--mono); font-size: 12px; }

  /* STATUS BADGE */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 2px;
    white-space: nowrap;
  }
  .badge-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .badge.stale     { background: rgba(239,68,68,0.12);  color: var(--stale);   }
  .badge.stale .badge-dot    { background: var(--stale); }
  .badge.good      { background: rgba(34,197,94,0.10);  color: var(--good);    }
  .badge.good .badge-dot     { background: var(--good); }
  .badge.unknown   { background: rgba(245,158,11,0.12); color: var(--unknown); }
  .badge.unknown .badge-dot  { background: var(--unknown); }
  .badge.updating  { background: rgba(139,92,246,0.12); color: var(--updating);}
  .badge.updating .badge-dot { background: var(--updating); animation: pulse 1s infinite; }
  .badge.failed    { background: rgba(239,68,68,0.12);  color: var(--stale);   }
  .badge.failed .badge-dot   { background: var(--stale); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }

  .device-name { font-weight: 600; color: #e2e8f0; max-width: 260px; }
  .device-class { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .version-current { color: var(--text); }
  .version-latest  { color: var(--good); font-size: 11px; margin-top: 2px; }
  td .tip { color: var(--dim); font-size: 11px; margin-top: 2px; }

  /* EMPTY / LOADING */
  .empty-state {
    text-align: center;
    padding: 80px 0;
    color: var(--dim);
  }
  .empty-state h3 {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
    color: var(--text);
  }

  /* SCAN PROGRESS */
  .scan-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,12,15,0.85);
    z-index: 200;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
  }
  .scan-overlay.active { display: flex; }
  .scan-box {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 40px 60px;
    text-align: center;
  }
  .scan-title {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
  }
  .scan-msg { color: var(--dim); font-size: 13px; }
  .progress-bar-wrap {
    margin-top: 24px;
    width: 300px;
    height: 2px;
    background: var(--muted);
    position: relative;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    animation: sweep 1.8s ease-in-out infinite;
    width: 40%;
    border-radius: 1px;
  }
  @keyframes sweep {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(800%); }
  }

  /* TOAST */
  .toast-wrap {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 300;
  }
  .toast {
    font-family: var(--mono);
    font-size: 12px;
    padding: 12px 18px;
    border-radius: 2px;
    border-left: 3px solid;
    background: var(--surface);
    border-color: var(--accent);
    color: var(--text);
    max-width: 380px;
    animation: slideIn 0.2s ease;
  }
  .toast.success { border-color: var(--good); }
  .toast.error   { border-color: var(--stale); }
  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to   { transform: translateX(0);   opacity: 1; }
  }
  .toast-msg { word-break: break-word; }
  .toast-action { margin-top: 10px; padding: 4px 12px; }

  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .action-cell { display: flex; gap: 6px; }

  /* DIALOG */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10,12,15,0.85);
    z-index: 400;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    width: 100%;
    max-width: 480px;
    padding: 24px;
  }
  .modal-title {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
  }
  .modal-body { display: flex; flex-direction: column; gap: 8px; font-size: 13px; line-height: 1.5; }
  .modal-meta { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .modal-meta.strong { color: #e2e8f0; font-family: var(--sans); font-size: 14px; font-weight: 600; }
  .modal-note { font-size: 12px; color: var(--good); }
  .modal-warn { font-size: 12px; color: var(--unknown); }
  .modal-path { font-family: var(--mono); font-size: 11px; color: var(--dim); word-break: break-all; }
  .modal-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 24px; }

  @media (prefers-reduced-motion: reduce) {
    .toast, .badge.updating .badge-dot, .progress-bar-fill { animation: none; }
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <div class="topbar-left">
    <div class="logo">DRVSCAN<span>/v1</span></div>
    <div class="system-tag" id="systemTag">WINDOWS</div>
    <div class="system-tag" id="lastScanTag">NOT SCANNED</div>
  </div>
  <div class="topbar-right">
    <button class="btn" onclick="pnpScanAll()">PNPUTIL SCAN ALL</button>
    <button class="btn btn-primary" id="scanBtn" onclick="triggerScan()">▶ RUN SCAN</button>
  </div>
</header>

<!-- STATS -->
<section class="stat-bar">
  <div class="stat">
    <div class="stat-label">Total Drivers</div>
    <div class="stat-value neutral" id="statTotal">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">Stale / Outdated</div>
    <div class="stat-value stale" id="statStale">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">Up to Date</div>
    <div class="stat-value good" id="statGood">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">Unknown</div>
    <div class="stat-value warn" id="statUnknown">—</div>
  </div>
</section>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="toolbar-left">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input class="search-input" id="searchInput" placeholder="Filter drivers..." oninput="renderTable()">
    </div>
    <select class="filter-select" id="statusFilter" onchange="renderTable()">
      <option value="">ALL STATUS</option>
      <option value="STALE">STALE</option>
      <option value="UP_TO_DATE">UP TO DATE</option>
      <option value="UNKNOWN">UNKNOWN</option>
      <option value="UPDATE_FAILED">FAILED</option>
      <option value="PENDING_REBOOT">REBOOT</option>
    </select>
    <select class="filter-select" id="classFilter" onchange="renderTable()">
      <option value="">ALL CLASSES</option>
    </select>
  </div>
  <div id="rowCount" style="font-family:var(--mono);font-size:11px;color:var(--dim);">—</div>
</div>

<!-- TABLE -->
<div class="table-wrap">
  <table id="driverTable">
    <thead>
      <tr>
        <th>DEVICE</th>
        <th>CLASS</th>
        <th>CURRENT VERSION</th>
        <th>DRIVER DATE</th>
        <th>PROVIDER</th>
        <th>STATUS</th>
        <th>ACTION</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr>
        <td colspan="7">
          <div class="empty-state">
            <h3>No scan data</h3>
            <p>Click <strong>RUN SCAN</strong> to enumerate installed drivers and check Windows Update.</p>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- SCAN OVERLAY -->
<div class="scan-overlay" id="scanOverlay">
  <div class="scan-box">
    <div class="scan-title">SCANNING SYSTEM</div>
    <div class="scan-msg" id="scanMsg">Querying WMI for installed drivers...</div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill"></div></div>
  </div>
</div>

<!-- TOASTS -->
<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

<!-- DIALOG -->
<div class="modal-backdrop" id="dialog" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogBody">
    <h2 class="modal-title" id="dialogTitle"></h2>
    <div class="modal-body" id="dialogBody"></div>
    <div class="modal-actions" id="dialogActions"></div>
  </div>
</div>

<script>
  let allDrivers = [];
  const msgs = [
    'Querying WMI for installed drivers...',
    'Checking Windows Update catalog...',
    'Comparing driver versions...',
    'Analyzing staleness data...'
  ];

  let apiToken = null;

  async function getApiToken(refresh) {
    if (!apiToken || refresh) {
      const res = await fetch('/api/token', { cache: 'no-store' });
      if (!res.ok) throw new Error('Could not obtain API token (' + res.status + ')');
      apiToken = (await res.json()).token;
    }
    return apiToken;
  }

  // State-changing requests must carry the per-start token; a 403 may mean the server restarted.
  async function apiFetch(url, opts = {}) {
    const send = async (refresh) => fetch(url, {
      ...opts,
      headers: { ...(opts.headers || {}), 'X-DD-Token': await getApiToken(refresh) },
    });
    const res = await send(false);
    return res.status === 403 ? send(true) : res;
  }

  // ── SCAN ──────────────────────────────────────────────────────────────────
  async function triggerScan() {
    showOverlay(true);
    let i = 0;
    const ticker = setInterval(() => {
      document.getElementById('scanMsg').textContent = msgs[i++ % msgs.length];
    }, 3000);

    try {
      const res = await apiFetch('/api/drivers/scan', { method: 'POST' });
      if (!res.ok) throw new Error((await res.json()).error || res.statusText);
      const data = await res.json();
      allDrivers = data.drivers || [];
      updateStats(data.total, data.stale, data.upToDate, data.unknown);
      populateClassFilter();
      renderTable();
      document.getElementById('lastScanTag').textContent = 'SCANNED ' + new Date().toLocaleTimeString();
      toast('Scan complete — ' + data.total + ' drivers found.', 'success');
    } catch (e) {
      toast('Scan failed: ' + e.message, 'error');
    } finally {
      clearInterval(ticker);
      showOverlay(false);
    }
  }

  // ── UPDATE SINGLE DRIVER ──────────────────────────────────────────────────
  const driverUrl = id => '/api/drivers/' + encodeURIComponent(id);

  async function updateDriver(deviceId) {
    const d = allDrivers.find(x => x.deviceId === deviceId);
    if (!d) return;

    const status = await fetchBackupStatus(deviceId);
    const choice = status.firmware ? await firmwareDialog(d) : await backupDialog(d, status);
    if (!choice) return;
    await runUpdate(deviceId, choice === 'backup');
  }

  async function fetchBackupStatus(deviceId) {
    try {
      const res = await fetch(driverUrl(deviceId) + '/backup-status');
      if (!res.ok) throw new Error(res.statusText);
      return await res.json();
    } catch (_) {
      return { firmware: false, hasRecentBackup: false, unavailable: true };
    }
  }

  function driverLines(d) {
    return [
      { text: d.deviceName || '—', cls: 'modal-meta strong' },
      { text: 'Installed version: ' + (d.driverVersion || '—'), cls: 'modal-meta' },
    ];
  }

  function backupDialog(d, status) {
    const lines = driverLines(d);
    if (status.hasRecentBackup) {
      const when = status.timestamp ? new Date(status.timestamp).toLocaleString() : 'recently';
      lines.push({ text: 'A recent backup from ' + when + ' exists and will be reused.', cls: 'modal-note' });
    } else if (status.unavailable) {
      lines.push({ text: 'Backup status could not be checked.', cls: 'modal-warn' });
    }
    return openDialog({
      title: 'Back up the current driver before updating?',
      lines,
      buttons: [
        { label: 'Cancel', value: null },
        { label: 'Update without backup', value: 'skip' },
        { label: 'Back up & update', value: 'backup', kind: 'primary', autofocus: true },
      ],
    });
  }

  function firmwareDialog(d) {
    return openDialog({
      title: 'Update firmware?',
      lines: [
        ...driverLines(d),
        'Firmware has no driver package to back up. It is updated through the vendor\'s tooling.',
      ],
      buttons: [
        { label: 'Cancel', value: null },
        { label: 'Update', value: 'update', kind: 'primary', autofocus: true },
      ],
    });
  }

  async function runUpdate(deviceId, backup) {
    const btn = document.getElementById('btn-' + deviceId);
    if (btn) { btn.disabled = true; btn.textContent = 'UPDATING...'; }

    const d = allDrivers.find(x => x.deviceId === deviceId);
    const before = d && { status: d.status, statusMessage: d.statusMessage };
    if (d) { d.status = 'UPDATING'; renderTable(); }

    try {
      const res = await apiFetch(driverUrl(deviceId) + '/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ backup }),
      });
      const result = await res.json();

      if (res.status === 409 && result.requiresConfirmation) {
        if (d) { Object.assign(d, before); renderTable(); }
        const proceed = await openDialog({
          title: 'Backup failed',
          lines: ['Backup failed: ' + (result.backupError || result.message) + '. Update anyway without a backup?'],
          buttons: [
            { label: 'Cancel', value: null, autofocus: true },
            { label: 'Update without backup', value: 'go', kind: 'danger' },
          ],
        });
        if (proceed) await runUpdate(deviceId, false);
        return;
      }

      let msg = result.message;
      if (d) {
        if (result.success && !result.requiresConfirmation) {
          let f = null;
          try {
            const fresh = await (await fetch('/api/drivers')).json();
            f = fresh.find(x => x.deviceId === deviceId) || null;
          } catch (_) { f = null; }
          if (f) {
            Object.assign(d, f); msg = f.statusMessage || msg;
          } else {
            msg = 'Update reported success; could not verify status.';
            d.status = 'UNKNOWN';
            d.statusMessage = msg;
          }
        } else {
          d.status = 'UPDATE_FAILED';
          d.statusMessage = result.message;
        }
        if (result.success && result.backupPath) d.lastBackupPath = result.backupPath;
        renderTable();
      }
      if (result.success && result.backupPath) {
        const path = result.backupPath;
        toast(msg + ' — Backed up to ' + path, 'success',
          { label: 'Rollback', onClick: () => rollbackDriver(deviceId, path) });
      } else {
        toast(msg, d && d.status !== 'UPDATE_FAILED' ? 'success' : 'error');
      }
    } catch (e) {
      if (d) { d.status = 'UPDATE_FAILED'; d.statusMessage = e.message; renderTable(); }
      toast('Update failed: ' + e.message, 'error');
    }
  }

  // ── ROLLBACK ──────────────────────────────────────────────────────────────
  async function rollbackDriver(deviceId, backupPath) {
    const d = allDrivers.find(x => x.deviceId === deviceId);
    const ok = await openDialog({
      title: 'Roll back driver?',
      lines: [
        ...(d ? driverLines(d) : []),
        'Reinstall the driver package backed up to:',
        { text: backupPath, cls: 'modal-path' },
      ],
      buttons: [
        { label: 'Cancel', value: null },
        { label: 'Roll back', value: 'go', kind: 'primary', autofocus: true },
      ],
    });
    if (!ok) return;

    try {
      const res = await apiFetch(driverUrl(deviceId) + '/rollback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ backupPath }),
      });
      const result = await res.json();
      if (!res.ok) throw new Error(result.error || res.statusText);
      await refreshDriver(deviceId, { clearBackup: true });
      toast('Rolled back from ' + backupPath, 'success');
    } catch (e) {
      toast('Rollback failed: ' + e.message, 'error');
    }
  }

  async function refreshDriver(deviceId, { clearBackup = false } = {}) {
    const d = allDrivers.find(x => x.deviceId === deviceId);
    // The backup was consumed by the rollback, so the ROLLBACK button must go even if the refetch fails.
    if (d && clearBackup) delete d.lastBackupPath;
    try {
      const fresh = await (await fetch('/api/drivers')).json();
      const f = fresh.find(x => x.deviceId === deviceId);
      if (d && f) Object.assign(d, f);
    } catch (_) { /* row keeps its last known state */ }
    if (d) renderTable();
  }

  // ── DIALOG ────────────────────────────────────────────────────────────────
  // Resolves with the chosen button's value, or null on Cancel / Esc / backdrop click.
  function openDialog({ title, lines, buttons }) {
    const root = document.getElementById('dialog');
    const box = root.querySelector('.modal');
    const opener = document.activeElement;

    document.getElementById('dialogTitle').textContent = title;
    document.getElementById('dialogBody').replaceChildren(...lines.map(line => {
      const p = document.createElement('p');
      if (typeof line === 'string') {
        p.textContent = line;
      } else {
        p.textContent = line.text;
        p.className = line.cls;
      }
      return p;
    }));

    return new Promise(resolve => {
      const btns = buttons.map(b => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'btn' + (b.kind ? ' btn-' + b.kind : '');
        el.textContent = b.label;
        el.addEventListener('click', () => close(b.value));
        return el;
      });
      document.getElementById('dialogActions').replaceChildren(...btns);

      const onKey = e => {
        if (e.key === 'Escape') { e.preventDefault(); close(null); return; }
        if (e.key !== 'Tab') return;
        const first = btns[0], last = btns[btns.length - 1];
        if (!box.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
        else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      };
      const onBackdrop = e => { if (e.target === root) close(null); };

      function setBackgroundInert(on) {
        for (const el of document.body.children) if (el !== root) el.inert = on;
      }

      function close(value) {
        document.removeEventListener('keydown', onKey, true);
        root.removeEventListener('click', onBackdrop);
        root.hidden = true;
        setBackgroundInert(false);
        if (opener && opener.isConnected) opener.focus();
        resolve(value);
      }

      document.addEventListener('keydown', onKey, true);
      root.addEventListener('click', onBackdrop);
      setBackgroundInert(true);
      root.hidden = false;
      (btns[buttons.findIndex(b => b.autofocus)] || btns[btns.length - 1]).focus();
    });
  }

  // ── PNPUTIL SCAN ALL ──────────────────────────────────────────────────────
  async function pnpScanAll() {
    toast('Running pnputil /scan-devices...', '');
    try {
      const res = await apiFetch('/api/drivers/scan-all-devices', { method: 'POST' });
      const result = await res.json();
      toast(result.message, result.success ? 'success' : 'error');
    } catch (e) {
      toast('pnputil error: ' + e.message, 'error');
    }
  }

  // ── RENDER ────────────────────────────────────────────────────────────────
  function renderTable() {
    const q      = document.getElementById('searchInput').value.toLowerCase();
    const status = document.getElementById('statusFilter').value;
    const cls    = document.getElementById('classFilter').value;

    const filtered = allDrivers.filter(d => {
      const matchQ = !q || (d.deviceName || '').toLowerCase().includes(q)
                       || (d.provider || '').toLowerCase().includes(q)
                       || (d.driverVersion || '').toLowerCase().includes(q);
      const matchS = !status || d.status === status;
      const matchC = !cls || d.deviceClass === cls;
      return matchQ && matchS && matchC;
    });

    document.getElementById('rowCount').textContent = filtered.length + ' drivers';

    const tbody = document.getElementById('tableBody');
    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">
        <h3>No drivers match filter</h3><p>Adjust the search or filter criteria.</p>
      </div></td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(d => `
      <tr>
        <td>
          <div class="device-name">${esc(d.deviceName || '—')}</div>
        </td>
        <td class="device-class">${esc(d.deviceClass || '—')}</td>
        <td class="mono">
          <div class="version-current">${esc(d.driverVersion || '—')}</div>
          ${d.latestVersion ? `<div class="version-latest">▲ ${esc(d.latestVersion)}</div>` : ''}
        </td>
        <td class="mono">${formatDate(d.driverDate)}</td>
        <td style="color:var(--dim);font-size:12px">${esc(d.provider || '—')}</td>
        <td>${badge(d)}</td>
        <td>${actionBtn(d)}</td>
      </tr>
    `).join('');
  }

  function badge(d) {
    const map = {
      STALE:         ['stale',   '● STALE'],
      UP_TO_DATE:    ['good',    '● OK'],
      UNKNOWN:       ['unknown', '● UNKNOWN'],
      UPDATING:      ['updating','● UPDATING'],
      UPDATE_FAILED: ['failed',  '● FAILED'],
      PENDING_REBOOT: ['unknown', '● REBOOT'],
    };
    const [cls, label] = map[d.status] || ['unknown', '● —'];
    const tip = d.statusMessage ? ` title="${esc(d.statusMessage)}"` : '';
    return `<span class="badge ${cls}"${tip}>${label}</span>`;
  }

  function actionBtn(d) {
    if (d.status === 'UPDATING') {
      return `<button class="btn" disabled id="btn-${esc(d.deviceId)}">UPDATING...</button>`;
    }
    const parts = [];
    if (d.status === 'STALE' || d.status === 'UPDATE_FAILED') {
      parts.push(`<button class="btn btn-danger" id="btn-${esc(d.deviceId)}"
        data-update="${esc(d.deviceId)}">UPDATE</button>`);
    }
    if (d.lastBackupPath) {
      parts.push(`<button class="btn" data-rollback="${esc(d.deviceId)}"
        title="${esc('Backed up to ' + d.lastBackupPath)}">ROLLBACK</button>`);
    }
    if (!parts.length) {
      return `<span style="color:var(--dim);font-family:var(--mono);font-size:11px">—</span>`;
    }
    return `<div class="action-cell">${parts.join('')}</div>`;
  }

  // Delegated so device IDs never get interpolated into inline JS handlers.
  document.getElementById('tableBody').addEventListener('click', e => {
    const upd = e.target.closest('[data-update]');
    if (upd) { updateDriver(upd.dataset.update); return; }
    const rb = e.target.closest('[data-rollback]');
    if (!rb) return;
    const d = allDrivers.find(x => x.deviceId === rb.dataset.rollback);
    if (d && d.lastBackupPath) rollbackDriver(d.deviceId, d.lastBackupPath);
  });

  function updateStats(total, stale, good, unknown) {
    document.getElementById('statTotal').textContent   = total   ?? '—';
    document.getElementById('statStale').textContent   = stale   ?? '—';
    document.getElementById('statGood').textContent    = good    ?? '—';
    document.getElementById('statUnknown').textContent = unknown ?? '—';
  }

  function populateClassFilter() {
    const classes = [...new Set(allDrivers.map(d => d.deviceClass).filter(Boolean))].sort();
    const sel = document.getElementById('classFilter');
    sel.innerHTML = '<option value="">ALL CLASSES</option>' +
      classes.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  }

  function formatDate(raw) {
    if (!raw || raw.length < 8) return '—';
    try {
      const y = raw.substring(0, 4);
      const m = raw.substring(4, 6);
      const day = raw.substring(6, 8);
      return `${y}-${m}-${day}`;
    } catch { return raw; }
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showOverlay(on) {
    document.getElementById('scanOverlay').classList.toggle('active', on);
    document.getElementById('scanBtn').disabled = on;
  }

  const TOAST_MS = 5000;
  const TOAST_ACTION_MS = 15000;

  function toast(msg, type, action) {
    const wrap = document.getElementById('toastWrap');
    const t = document.createElement('div');
    t.className = 'toast ' + (type || '');
    const text = document.createElement('div');
    text.className = 'toast-msg';
    text.textContent = msg;
    t.appendChild(text);
    if (action) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn toast-action';
      b.textContent = action.label;
      b.addEventListener('click', () => { t.remove(); action.onClick(); });
      t.appendChild(b);
    }
    wrap.appendChild(t);
    setTimeout(() => t.remove(), action ? TOAST_ACTION_MS : TOAST_MS);
  }
</script>
</body>
</html>
