server.port=8080
spring.application.name=driver-dashboard
spring.cache.type=simple
logging.level.com.driverscanner=INFO

# Daily driver scan schedule (Spring cron: sec min hour day month weekday)
# Default: 2:00 AM every day
driver.scan.schedule=0 0 2 * * ?


# Max chars of the driver-name array per PowerShell command (Windows command-line limit guard)
driver.scan.ps-command-max-chars=24000

# Backups younger than this are reused instead of exporting a new one before an update
driver.backup.recent-days=7
