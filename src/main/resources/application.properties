server.port=8080
spring.application.name=driver-dashboard
spring.cache.type=simple
logging.level.com.driverscanner=INFO

# Daily driver scan schedule (Spring cron: sec min hour day month weekday)
# Default: 2:00 AM every day
driver.scan.schedule=0 0 2 * * ?



# Backups younger than this are reused instead of exporting a new one before an update
driver.backup.recent-days=7

# Absolute folder for driver backups (<root>\<deviceId>\<timestamp>).
# Default resolves from the LOCALAPPDATA environment variable; startup fails if that
# is unset and no absolute override is given here.
driver.backup.root=${LOCALAPPDATA:}\\DriverDashboard\\Backups

# Max seconds for the Windows Update driver query PowerShell process before it is killed
driver.scan.ps-timeout-seconds=300
